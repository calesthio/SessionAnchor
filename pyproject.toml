[project]
name = "SessionAnchor"
version = "0.1.1"
description = "One-command context memory for Claude Code sessions. Local SQLite, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GNU Affero General Public License v3"}
keywords = ["claude", "context", "memory", "ai", "llm", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
sessionanchor = "sessionanchor.cli:main"

[project.urls]
Homepage = "https://github.com/calesthio/SessionAnchor"
Repository = "https://github.com/calesthio/SessionAnchor"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sessionanchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
